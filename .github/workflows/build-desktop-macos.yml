name: "Build Desktop macOS (Exam Browser)"

on:
  push:
    tags:
      - 'release-desktop-*'
      - 'release-macos-*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: production
      version_name:
        description: 'Version Name / SemVer (e.g. 1.0.0 - kosongkan untuk ambil dari tag/package.json)'
        required: false
        type: string
        default: ''
      build_number:
        description: 'Build Number / Version Code (e.g. 1, 42 - kosongkan untuk pakai run number)'
        required: false
        type: string
        default: ''

jobs:
  build-macos:
    name: Build macOS Exam Browser (.dmg & .app)
    runs-on: macos-latest
    environment: ${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Riwayat + tag lengkap: catatan rilis membandingkan dengan tag rilis sebelumnya.
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Determine Target Environment & API URL
        id: env
        run: |
          TARGET="${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}"
          API_URL="${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://erapor.alakhyar.sch.id/api' }}"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          # Nama berkas: env hanya ditulis bila bukan production (mis. "-staging").
          echo "name_env=$([ "$TARGET" = production ] || echo "-$TARGET")" >> $GITHUB_OUTPUT

      - name: Determine App Version & Build Number
        id: version
        run: |
          VERSION="${{ inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_TAG="${{ github.ref_name }}"
              VERSION=$(echo "$RAW_TAG" | sed -E 's/^release-(desktop|win|macos|mobile|android|ios)-//' | sed -E 's/^v//')
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/ujian/package.json').version")
          fi
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          if [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            VERSION="${VERSION}.0.0"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi

          BUILD_NUM="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          BUILD_NUM=$(echo "$BUILD_NUM" | tr -dc '0-9')
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -eq 0 ]; then
            BUILD_NUM="1"
          fi

          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Target Environment : ${{ steps.env.outputs.target }}"
          echo "App Version Name   : $VERSION"
          echo "App Build Number   : $BUILD_NUM"
          echo "=========================================="

      - name: Apply App Version
        run: |
          node scripts/set-version.mjs "${{ steps.version.outputs.version_name }}" "${{ steps.version.outputs.build_number }}"

      - name: Build Web App & Desktop macOS App
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
          VITE_UPDATE_REPO: ${{ vars.RELEASE_REPO }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          npx @tauri-apps/cli build

      # Konvensi: cbt-al-akhyar-<platform>[-<env>]-v<versi>-b<build>[-<arch>][-<varian>].<ext>
      - name: Name Installer
        id: installer
        run: |
          DMG=$(ls apps/ujian/src-tauri/target/release/bundle/dmg/*.dmg)
          # Tauri: "<Produk>_<versi>_<arch>.dmg"
          ARCH=$(basename "$DMG" | sed -E 's/.*_([^_]+)\.dmg$/\1/; s/^x86_64$/x64/; s/^aarch64$/arm64/')
          BASE="cbt-al-akhyar-macos${{ steps.env.outputs.name_env }}-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}"
          OUT="$RUNNER_TEMP/installer"
          mkdir -p "$OUT"
          cp "$DMG" "$OUT/$BASE-$ARCH.dmg"
          ls -la "$OUT"
          echo "name=$BASE" >> $GITHUB_OUTPUT
          echo "dir=$OUT" >> $GITHUB_OUTPUT

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.dir }}/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || 'rsuregar/erapor-cbt-releases' }}
        run: |
          node scripts/publish-release.mjs "${{ github.ref_name }}" "${{ steps.installer.outputs.dir }}"/*
