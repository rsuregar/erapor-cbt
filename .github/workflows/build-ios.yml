name: "Build iOS App"

on:
  push:
    tags:
      - 'ios-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: production
      version_name:
        description: 'Version Name / SemVer (e.g. 1.0.0 - kosongkan untuk ambil dari tag/package.json)'
        required: false
        type: string
        default: ''
      build_number:
        description: 'Build Number / Version Code (e.g. 1, 42 - kosongkan untuk pakai run number)'
        required: false
        type: string
        default: ''

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    environment: ${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd apps/ujian
          npm install @capacitor/ios --save-exact

      - name: Determine Target Environment & API URL
        id: env
        run: |
          TARGET="${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}"
          API_URL="${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://erapor.alakhyar.sch.id/api' }}"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Determine App Version & Build Number
        id: version
        run: |
          VERSION="${{ inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_TAG="${{ github.ref_name }}"
              VERSION=$(echo "$RAW_TAG" | sed -E 's/^(android|ios|macos|windows|desktop)-//' | sed -E 's/^v//')
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/ujian/package.json').version")
          fi
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          if [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            VERSION="${VERSION}.0.0"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi

          BUILD_NUM="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          BUILD_NUM=$(echo "$BUILD_NUM" | tr -dc '0-9')
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -eq 0 ]; then
            BUILD_NUM="1"
          fi

          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Target Environment : ${{ steps.env.outputs.target }}"
          echo "App Version Name   : $VERSION"
          echo "App Build Number   : $BUILD_NUM"
          echo "=========================================="

      - name: Apply App Version
        run: |
          node scripts/set-version.mjs "${{ steps.version.outputs.version_name }}" "${{ steps.version.outputs.build_number }}"

      - name: Build Web App & Sync Capacitor iOS
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure iOS Version & Build Number
        run: |
          cd apps/ujian/ios/App
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          echo "Setting iOS marketing version to $VERSION_NAME and build number to $BUILD_NUMBER"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = ${VERSION_NAME};/g" App.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" App.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Build iOS Workspace (Simulator / Unsigned Archive)
        run: |
          cd apps/ujian/ios/App
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            MARKETING_VERSION="${VERSION_NAME}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compress iOS Archive
        run: |
          cd apps/ujian/ios/App/build
          zip -r App.xcarchive.zip App.xcarchive

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujian-al-akhyar-ios-${{ steps.env.outputs.target }}-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}.xcarchive.zip
          path: apps/ujian/ios/App/build/App.xcarchive.zip
