name: Build Mobile Apps (APK & iOS)

on:
  push:
    tags:
      - 'release-prod*'
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        type: choice
        required: true
        options:
          - all
          - android
          - ios
        default: all
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: production
      build_type:
        description: 'Build Type'
        type: choice
        required: true
        options:
          - release
          - debug
        default: release

jobs:
  build-android:
    name: Build Android APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Determine API URL
        id: env
        run: |
          TARGET="${{ inputs.environment || (startsWith(github.ref, 'refs/tags/release-prod') && 'production' || 'staging') }}"
          if [ "$TARGET" = "production" ]; then
            API_URL="${{ vars.VITE_API_URL_PROD || secrets.VITE_API_URL_PROD || 'https://erapor.alakhyar.sch.id/api' }}"
          else
            API_URL="${{ vars.VITE_API_URL_STAGING || secrets.VITE_API_URL_STAGING || 'https://staging.erapor.alakhyar.sch.id/api' }}"
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Build Web App & Sync Capacitor Android
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          npx cap sync android

      - name: Prepare Keystore (if secret provided)
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/ujian/android/app/release.keystore
          echo "has_keystore=true" >> $GITHUB_OUTPUT

      - name: Build Android APK
        run: |
          cd apps/ujian/android
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ] || [ "${{ steps.keystore.outputs.has_keystore }}" != "true" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="release.keystore" \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          fi

      - name: Locate Generated APK
        id: apk
        run: |
          APK_PATH=$(find apps/ujian/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujian-al-akhyar-${{ steps.env.outputs.target }}.apk
          path: ${{ steps.apk.outputs.path }}

  build-ios:
    name: Build iOS App
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd apps/ujian
          npm install @capacitor/ios --save-exact

      - name: Determine API URL
        id: env
        run: |
          TARGET="${{ inputs.environment || (startsWith(github.ref, 'refs/tags/release-prod') && 'production' || 'staging') }}"
          if [ "$TARGET" = "production" ]; then
            API_URL="${{ vars.VITE_API_URL_PROD || secrets.VITE_API_URL_PROD || 'https://erapor.alakhyar.sch.id/api' }}"
          else
            API_URL="${{ vars.VITE_API_URL_STAGING || secrets.VITE_API_URL_STAGING || 'https://staging.erapor.alakhyar.sch.id/api' }}"
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Build Web App & Sync Capacitor iOS
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build iOS Workspace (Simulator / Unsigned Archive)
        run: |
          cd apps/ujian/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compress iOS Archive
        run: |
          cd apps/ujian/ios/App/build
          zip -r App.xcarchive.zip App.xcarchive

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujian-al-akhyar-ios-${{ steps.env.outputs.target }}.xcarchive.zip
          path: apps/ujian/ios/App/build/App.xcarchive.zip
