name: "Staging · macOS"

# Build Exam Browser macOS STAGING saja (DMG; nama "CBT Al Akhyar Staging", identifier
# id.sch.alakhyar.cbt.staging, ikon oranye, API erapor.staging). Logika build ada di
# build-desktop-macos.yml (+ src-tauri/tauri.staging.conf.json).
on:
  workflow_dispatch:
    inputs:
      terbitkan:
        description: 'Terbitkan pra-rilis staging-<versi>-b<build> (unduhan + pembaruan otomatis app staging)'
        type: boolean
        default: true
      version_name:
        description: 'Versi X.Y.Z (kosong = dari package.json)'
        type: string
        default: ''

jobs:
  macos:
    uses: ./.github/workflows/build-desktop-macos.yml
    with:
      environment: staging
      version_name: ${{ inputs.version_name }}
      terbitkan_staging: ${{ inputs.terbitkan }}
    secrets: inherit
