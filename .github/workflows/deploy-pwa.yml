name: Deploy PWA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-pwa-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/release-prod') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/release-prod') && 'production' || 'staging') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine Target Environment & API URL
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/tags/release-prod* ]]; then
            TARGET="production"
          else
            TARGET="staging"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT

          API_URL="${{ vars.VITE_API_URL || secrets.VITE_API_URL || (TARGET == 'production' && 'https://erapor.alakhyar.sch.id/api' || 'https://erapor.staging.alakhyar.sch.id/api') }}"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

          if [ "$TARGET" = "production" ]; then
            HOST="${{ secrets.HOST || secrets.PROD_HOST }}"
            USER="${{ secrets.USERNAME || secrets.PROD_USERNAME }}"
            KEY="${{ secrets.SSH_KEY || secrets.PROD_SSH_KEY || secrets.PROD_PASSWORD }}"
            DEPLOY_PATH="${{ vars.PWA_PATH || vars.PROD_PWA_PATH || '/home/erapor/htdocs/ujian.alakhyar.sch.id' }}"
          else
            HOST="${{ secrets.HOST || secrets.STAGING_HOST || secrets.PROD_HOST }}"
            USER="${{ secrets.USERNAME || secrets.STAGING_USERNAME || secrets.PROD_USERNAME }}"
            KEY="${{ secrets.SSH_KEY || secrets.STAGING_SSH_KEY || secrets.PROD_SSH_KEY || secrets.PROD_PASSWORD }}"
            DEPLOY_PATH="${{ vars.PWA_PATH || vars.STAGING_PWA_PATH || '/home/erapor/htdocs/ujian.staging.alakhyar.sch.id' }}"
          fi

          echo "deploy_path=$DEPLOY_PATH" >> $GITHUB_OUTPUT
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "user=$USER" >> $GITHUB_OUTPUT

      - name: Build PWA Assets
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
        run: |
          npm run build -w @erapor-cbt/ujian

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist-${{ steps.env.outputs.target }}
          path: apps/ujian/dist/

      - name: Deploy to Server via SSH
        if: ${{ steps.env.outputs.host != '' && steps.env.outputs.user != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.env.outputs.host }}
          username: ${{ steps.env.outputs.user }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.PROD_SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD || secrets.PROD_PASSWORD }}
          source: 'apps/ujian/dist/*'
          target: ${{ steps.env.outputs.deploy_path }}
          strip_components: 3
