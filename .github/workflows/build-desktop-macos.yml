name: "Build Desktop macOS (Exam Browser)"

on:
  push:
    tags:
      - 'macos-*'
      - 'desktop-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: production

jobs:
  build-macos:
    name: Build macOS Exam Browser (.dmg & .app)
    runs-on: macos-latest
    environment: ${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Determine API URL
        id: env
        run: |
          TARGET="${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}"
          API_URL="${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://erapor.alakhyar.sch.id/api' }}"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Build Web App & Desktop macOS App
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          npx @tauri-apps/cli build

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: cbt-al-akhyar-macos-${{ steps.env.outputs.target }}
          path: apps/ujian/src-tauri/target/release/bundle/dmg/*.dmg
