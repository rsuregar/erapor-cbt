name: "Build Desktop Windows (Exam Browser)"

on:
  push:
    tags:
      - 'windows-*'
      - 'desktop-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: production

jobs:
  build-windows:
    name: Build Windows Exam Browser (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Determine API URL
        id: env
        shell: bash
        run: |
          TARGET="${{ inputs.environment || (startsWith(github.ref, 'refs/tags/windows-prod') && 'production' || 'staging') }}"
          if [ "$TARGET" = "production" ]; then
            API_URL="${{ vars.VITE_API_URL_PROD || secrets.VITE_API_URL_PROD || 'https://erapor.alakhyar.sch.id/api' }}"
          else
            API_URL="${{ vars.VITE_API_URL_STAGING || secrets.VITE_API_URL_STAGING || 'https://staging.erapor.alakhyar.sch.id/api' }}"
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Build Web App & Desktop Windows App
        shell: bash
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          npx @tauri-apps/cli build

      - name: Upload Windows MSI & NSIS Installers
        uses: actions/upload-artifact@v4
        with:
          name: cbt-al-akhyar-windows-${{ steps.env.outputs.target }}
          path: |
            apps/ujian/src-tauri/target/release/bundle/nsis/*.exe
            apps/ujian/src-tauri/target/release/bundle/msi/*.msi
