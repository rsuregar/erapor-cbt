name: "Build Desktop Windows (Exam Browser)"

on:
  push:
    tags:
      - 'release-win-*'
      - 'release-windows-*'
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      version_name:
        type: string
        default: ''
      build_number:
        type: string
        default: ''
      terbitkan_staging:
        description: 'Terbitkan pra-rilis staging-<versi>-b<build> (dipakai workflow staging-*.yml)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: production
      version_name:
        description: 'Version Name / SemVer (e.g. 1.0.0 - kosongkan untuk ambil dari tag/package.json)'
        required: false
        type: string
        default: ''
      build_number:
        description: 'Build Number / Version Code (e.g. 1, 42 - kosongkan untuk pakai run number)'
        required: false
        type: string
        default: ''

jobs:
  build-windows:
    name: Build Windows Exam Browser (.msi)
    runs-on: windows-latest
    environment: ${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Riwayat + tag lengkap: catatan rilis membandingkan dengan tag rilis sebelumnya.
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Determine Target Environment & API URL
        id: env
        shell: bash
        run: |
          TARGET="${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}"
          # Variabel environment GitHub menang; tanpa itu staging → server uji, production → server utama.
          API_URL="${{ vars.VITE_API_URL || secrets.VITE_API_URL }}"
          if [ -z "$API_URL" ]; then
            if [ "$TARGET" = "staging" ]; then API_URL="https://erapor.staging.alakhyar.sch.id/api"; else API_URL="https://erapor.alakhyar.sch.id/api"; fi
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          # Nama berkas: env hanya ditulis bila bukan production (mis. "-staging").
          echo "name_env=$([ "$TARGET" = production ] || echo "-$TARGET")" >> $GITHUB_OUTPUT

      - name: Determine App Version & Build Number
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_TAG="${{ github.ref_name }}"
              VERSION=$(echo "$RAW_TAG" | sed -E 's/^release-(desktop|win|macos|mobile|android|ios)-//' | sed -E 's/^v//')
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/ujian/package.json').version")
          fi
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          if [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            VERSION="${VERSION}.0.0"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi

          BUILD_NUM="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          BUILD_NUM=$(echo "$BUILD_NUM" | tr -dc '0-9')
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -eq 0 ]; then
            BUILD_NUM="1"
          fi

          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Target Environment : ${{ steps.env.outputs.target }}"
          echo "App Version Name   : $VERSION"
          echo "App Build Number   : $BUILD_NUM"
          echo "=========================================="

      - name: Apply App Version
        shell: bash
        run: |
          node scripts/set-version.mjs "${{ steps.version.outputs.version_name }}" "${{ steps.version.outputs.build_number }}"

      - name: Build Web App & Desktop Windows App
        id: build
        shell: bash
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
          VITE_APP_BUILD: ${{ steps.version.outputs.build_number }}
          VITE_LINGKUNGAN: ${{ steps.env.outputs.target }}
          VITE_TARGET_NATIVE: "1"
          VITE_UPDATE_REPO: ${{ vars.RELEASE_REPO }}
          # Updater di dalam app (opsional): tanpa keduanya, build tetap jalan dan app memakai unduh manual.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          # Authenticode signing Windows (opsional): dukung Azure Trusted Signing (WINDOWS_SIGN_COMMAND) atau PFX.
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          ARGS=()
          # Staging: nama, identifier, & ikon terpisah (bisa dipasang berdampingan dengan produksi).
          if [ "${VITE_LINGKUNGAN}" = staging ]; then ARGS+=(--config src-tauri/tauri.staging.conf.json); fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            ARGS+=(--config "$(node -e 'console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.TAURI_UPDATER_PUBKEY}}}))')")
            echo "updater=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Updater di dalam app nonaktif: isi secret TAURI_SIGNING_PRIVATE_KEY dan variable TAURI_UPDATER_PUBKEY."
          fi
          if [ -n "$WINDOWS_SIGN_COMMAND" ]; then
            ARGS+=(--config "$(node -e 'console.log(JSON.stringify({bundle:{windows:{signCommand:process.env.WINDOWS_SIGN_COMMAND}}}))')")
          elif [ -n "$WINDOWS_CERTIFICATE_BASE64" ]; then
            PFX_POSIX="$RUNNER_TEMP/windows-cert.pfx"
            echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$PFX_POSIX"
            PFX_WIN="$PFX_POSIX"
            if command -v cygpath >/dev/null 2>&1; then
              PFX_WIN=$(cygpath -w "$PFX_POSIX")
            fi
            SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name "signtool.exe" -path "*/x64/*" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "$SIGNTOOL" ]; then
              SIGNTOOL="signtool.exe"
            elif command -v cygpath >/dev/null 2>&1; then
              SIGNTOOL=$(cygpath -w "$SIGNTOOL")
            fi
            export SIGNTOOL PFX_WIN
            ARGS+=(--config "$(node -e '
              const q = (s) => `"${String(s).replace(/"/g, "\\\"")}"`;
              const args = [q(process.env.SIGNTOOL), "sign", "/f", q(process.env.PFX_WIN)];
              if (process.env.WINDOWS_CERTIFICATE_PASSWORD) {
                args.push("/p", q(process.env.WINDOWS_CERTIFICATE_PASSWORD));
              }
              args.push("/tr", "http://timestamp.digicert.com", "/td", "sha256", "/fd", "sha256", "%1");
              console.log(JSON.stringify({ bundle: { windows: { signCommand: args.join(" ") } } }));
            ')")
          else
            echo "::notice::Windows Authenticode signing nonaktif: isi secret WINDOWS_SIGN_COMMAND (mis. Azure Trusted Signing) atau WINDOWS_CERTIFICATE_BASE64."
          fi
          npx @tauri-apps/cli build --bundles msi "${ARGS[@]}"

      # Konvensi: cbt-al-akhyar-<platform>[-<env>]-v<versi>-b<build>[-<arch>][-<varian>].<ext>
      - name: Name Installers
        id: installer
        shell: bash
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO || 'rsuregar/erapor-cbt-releases' }}
        run: |
          BUNDLE=apps/ujian/src-tauri/target/release/bundle
          MSI=$(ls "$BUNDLE"/msi/*.msi | head -n 1)
          # Tauri: "<Produk>_<versi>_<arch>_<locale>.msi"
          ARCH=$(basename "$MSI" | sed -E 's/.*_(x64|x86_64|arm64|aarch64|x86)(_[^.]+)?\.msi$/\1/; s/^x86_64$/x64/; s/^aarch64$/arm64/')
          if [ -z "$ARCH" ] || [ "$ARCH" = "$(basename "$MSI")" ]; then ARCH="x64"; fi
          BASE="cbt-al-akhyar-windows${{ steps.env.outputs.name_env }}-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}"
          OUT="$RUNNER_TEMP/installer"
          mkdir -p "$OUT"
          cp "$MSI" "$OUT/$BASE-$ARCH.msi"
          # Manifes updater: hanya bila build ditandatangani dan berkas akan diterbitkan ke rilis (tag-nya pasti).
          TAG=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ inputs.terbitkan_staging }}" = true ] && [ "${{ steps.env.outputs.target }}" = staging ]; then
            TAG="staging-${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}"
          fi
          if [ "${{ steps.build.outputs.updater }}" = true ] && [ -n "$TAG" ]; then
            SIG=$(ls "$BUNDLE"/msi/*.msi.sig)
            TARGET_ARCH="windows-$(echo "$ARCH" | sed -E 's/^x64$/x86_64/; s/^arm64$/aarch64/')"
            # Updater Windows menjalankan pemasang MSI (WiX) yang sama dengan unduhan manual.
            ASET="$BASE-$ARCH.msi"
            node scripts/buat-manifes-updater.mjs "$OUT/$BASE-updater.json" "${{ steps.version.outputs.version_name }}" "$TARGET_ARCH" \
              "https://github.com/$RELEASE_REPO/releases/download/$TAG/$ASET" "$SIG"
          fi
          ls -la "$OUT"
          echo "name=$BASE" >> $GITHUB_OUTPUT
          echo "dir=$OUT" >> $GITHUB_OUTPUT

      - name: Upload Windows MSI Installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.dir }}/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-') || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || 'rsuregar/erapor-cbt-releases' }}
        run: |
          node scripts/publish-release.mjs "${{ github.ref_name }}" "${{ steps.installer.outputs.dir }}"/*

      - name: Publish staging pre-release
        if: inputs.terbitkan_staging && steps.env.outputs.target == 'staging'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || 'rsuregar/erapor-cbt-releases' }}
        run: |
          node scripts/publish-staging.mjs "staging-${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}" "${{ steps.installer.outputs.dir }}"/*
