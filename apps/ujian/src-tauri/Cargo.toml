[package]
name = "app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
repository = "https://github.com/rsuregar/erapor-cbt"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tauri-plugin-opener = "2"
