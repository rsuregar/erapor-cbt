name: "Build iOS App"

on:
  push:
    tags:
      - 'ios-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options:
          - staging
          - production
        default: production

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    environment: ${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd apps/ujian
          npm install @capacitor/ios --save-exact

      - name: Determine API URL
        id: env
        run: |
          TARGET="${{ inputs.environment || (contains(github.ref, 'staging') && 'staging' || 'production') }}"
          API_URL="${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://erapor.alakhyar.sch.id/api' }}"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Build Web App & Sync Capacitor iOS
        env:
          VITE_API_URL: ${{ steps.env.outputs.api_url }}
        run: |
          npm run build -w @erapor-cbt/ujian
          cd apps/ujian
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build iOS Workspace (Simulator / Unsigned Archive)
        run: |
          cd apps/ujian/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compress iOS Archive
        run: |
          cd apps/ujian/ios/App/build
          zip -r App.xcarchive.zip App.xcarchive

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujian-al-akhyar-ios-${{ steps.env.outputs.target }}.xcarchive.zip
          path: apps/ujian/ios/App/build/App.xcarchive.zip
